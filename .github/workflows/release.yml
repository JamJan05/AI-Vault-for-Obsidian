name: Build and Release

on:
  release:
    types:
      - published

# Nothing at workflow level needs write access; the publishing job grants its own.
permissions:
  contents: read

concurrency:
  # One publish at a time per tag. Never cancel a release in progress: a
  # half-uploaded release is worse than a queued one.
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # attestations + id-token: sign the build provenance.
      # contents: write: push the version commit and upload the release assets.
      attestations: write
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          # Credentials are deliberately kept: this job pushes the version commit
          # back to main and uploads the release assets.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate tag is semver
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          # Obsidian requires plain semver (x.y.z, optionally -prerelease). Fail fast
          # on bad tags like "1.0.2.1" before building or creating a release.
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '${VERSION}' is not valid semver (expected x.y.z or x.y.z-prerelease)."
            exit 1
          fi
          echo "Tag '${VERSION}' is valid semver."

      - name: Ensure stable releases are created from main
        if: ${{ !github.event.release.prerelease }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::Stable releases must be created from the current main branch. Use pre-release for beta/test branches."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update version files from tag
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const version = process.env.VERSION;
          const readJson = (p) => JSON.parse(fs.readFileSync(p, "utf8"));
          const writeJson = (p, d) => fs.writeFileSync(p, JSON.stringify(d, null, 2) + "\n");

          const manifest = readJson("manifest.json");
          manifest.version = version;
          writeJson("manifest.json", manifest);

          const pkg = readJson("package.json");
          pkg.version = version;
          writeJson("package.json", pkg);

          if (fs.existsSync("package-lock.json")) {
            const lock = readJson("package-lock.json");
            lock.version = version;
            if (lock.packages?.[""]) lock.packages[""].version = version;
            writeJson("package-lock.json", lock);
          }

          if (fs.existsSync("versions.json")) {
            const versions = readJson("versions.json");
            versions[version] = manifest.minAppVersion;
            writeJson("versions.json", versions);
          }
          NODE

      - name: Type check, lint and test
        # A release must not be built from code that does not pass the same gate
        # a pull request has to pass.
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build
        run: npm run build

      - name: Verify manifest, versions and release artefacts
        run: node scripts/compliance/verify-release-artifacts.mjs

      - name: Run the security and privacy compliance checks
        # Fail closed: a release is never published from a tree that fails the
        # compliance gate.
        run: npm run compliance

      - name: Upload the compliance report
        if: ${{ always() && (hashFiles('security-privacy-failure-report.md') != '' || hashFiles('security-privacy-success-report.md') != '') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-compliance-report-${{ github.event.release.tag_name }}
          path: |
            security-privacy-failure-report.md
            security-privacy-success-report.md
            compliance-report.json
            sbom.cdx.json
          retention-days: 14
          if-no-files-found: error

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Every file uploaded below must appear here, otherwise a consumer can
          # verify some published artefacts but not others.
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Commit updated version files to main
        if: ${{ !github.event.release.prerelease }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Everything above was built and checked from this commit. If main has
          # moved since, the version commit would sit on code this job never
          # tested, so stop instead of committing on top of it.
          BUILT_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "${BUILT_SHA}" ]; then
            echo "::error::main changed while the release was being built. Nothing was pushed; publish the release again from the current main."
            exit 1
          fi
          echo "BUILT_SHA=${BUILT_SHA}" >> "${GITHUB_ENV}"

          git checkout main
          git add manifest.json package.json versions.json
          git add package-lock.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update version to ${{ github.event.release.tag_name }}"
          # The lease repeats the check above at the moment of the push: it only
          # succeeds while main on GitHub is still the commit that was built.
          git push --force-with-lease="refs/heads/main:${BUILT_SHA}" origin HEAD:refs/heads/main

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" main.js styles.css manifest.json --clobber

      - name: Point the tag at the version commit
        # The release is created on the commit before the version files change,
        # so manifest.json at the tag would still name the previous version and
        # disagree with the published manifest. Moving the tag to the commit
        # that was just pushed makes the tag, the repository and the release
        # assets state the same version. It runs last, after the assets are
        # uploaded, so a failed upload never leaves a moved tag behind.
        if: ${{ !github.event.release.prerelease }}
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # The tag may only move to the commit that was built, or to the version
          # commit made directly on top of it.
          HEAD_SHA="$(git rev-parse HEAD)"
          PARENT_SHA="$(git rev-parse HEAD^)"
          if [ "${HEAD_SHA}" != "${BUILT_SHA}" ] && [ "${PARENT_SHA}" != "${BUILT_SHA}" ]; then
            echo "::error::Refusing to move tag ${TAG}: HEAD is not the built commit or its version commit."
            exit 1
          fi
          # What the tag ref holds right now. For an annotated tag this is the tag
          # object, not the commit, so it is read from the ref rather than assumed.
          EXPECTED_TAG_SHA="$(git rev-parse "refs/tags/${TAG}")"
          git tag --force "${TAG}"
          # The lease makes the push fail if the tag on GitHub has changed since it
          # was checked out, instead of overwriting someone else's update.
          git push --force-with-lease="refs/tags/${TAG}:${EXPECTED_TAG_SHA}" origin "refs/tags/${TAG}"
