name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Check and build plugin
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.release_version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve release version
        id: release_version
        shell: bash
        env:
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [[ -n "${RELEASE_TAG_NAME}" ]]; then
            echo "version=${RELEASE_TAG_NAME}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" != "push" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
            node -p '"version=" + require("./package.json").version' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git fetch --force --tags
          git tag --list > /tmp/ai-vault-release-tags.txt

          node <<'NODE' >> "${GITHUB_OUTPUT}"
          const fs = require("node:fs");
          const pkg = require("./package.json");

          const semverPattern = /^\d+\.\d+\.\d+$/;
          const parse = (version) => version.split(".").map(Number);
          const compare = (a, b) => {
            const pa = parse(a);
            const pb = parse(b);
            for (let i = 0; i < 3; i++) {
              if (pa[i] !== pb[i]) return pa[i] - pb[i];
            }
            return 0;
          };
          const incrementPatch = (version) => {
            const [major, minor, patch] = parse(version);
            return `${major}.${minor}.${patch + 1}`;
          };

          const packageVersion = semverPattern.test(pkg.version) ? pkg.version : "0.0.0";
          const tags = fs.readFileSync("/tmp/ai-vault-release-tags.txt", "utf8")
            .split(/\r?\n/)
            .map((tag) => tag.trim())
            .filter((tag) => semverPattern.test(tag))
            .sort(compare);

          const latestTag = tags.at(-1);
          const version = !latestTag || compare(latestTag, packageVersion) < 0
            ? packageVersion
            : incrementPatch(latestTag);

          console.log(`version=${version}`);
          NODE

      - name: Sync release metadata
        if: github.event_name == 'release' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const version = process.env.RELEASE_VERSION;
          if (!version) throw new Error("RELEASE_VERSION is empty");

          const readJson = (path) => JSON.parse(fs.readFileSync(path, "utf8"));
          const writeJson = (path, data) => {
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + "\n");
          };

          const manifest = readJson("manifest.json");
          manifest.version = version;
          writeJson("manifest.json", manifest);

          const pkg = readJson("package.json");
          pkg.version = version;
          writeJson("package.json", pkg);

          if (fs.existsSync("package-lock.json")) {
            const lock = readJson("package-lock.json");
            lock.version = version;
            if (lock.packages?.[""]) lock.packages[""].version = version;
            writeJson("package-lock.json", lock);
          }

          if (fs.existsSync("versions.json")) {
            const versions = readJson("versions.json");
            versions[version] = manifest.minAppVersion;

            const semver = /^\d+\.\d+\.\d+$/;
            const parse = (value) => value.split(".").map(Number);
            const compare = (a, b) => {
              const pa = parse(a);
              const pb = parse(b);
              for (let i = 0; i < 3; i++) {
                if (pa[i] !== pb[i]) return pa[i] - pb[i];
              }
              return 0;
            };
            const sorted = Object.fromEntries(
              Object.entries(versions).sort(([a], [b]) => {
                if (semver.test(a) && semver.test(b)) return compare(a, b);
                return a.localeCompare(b);
              }),
            );
            writeJson("versions.json", sorted);
          }
          NODE

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm run test --if-present

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-vault-plugin
          if-no-files-found: error
          path: |
            main.js
            styles.css
            manifest.json

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && !contains(github.event.head_commit.message || '', '[skip release]')) || (github.event_name == 'release' && github.event.release.prerelease)
    permissions:
      contents: write

    steps:
      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-vault-plugin

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_version }}
          name: ${{ needs.build.outputs.release_version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.build.outputs.release_version, '-') }}
          files: |
            main.js
            styles.css
            manifest.json

  notify-failure:
    name: Notify issues about main failure
    runs-on: ubuntu-latest
    needs: build
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      issues: write
      contents: read

    steps:
      - name: Create or update failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = "CI failure on main";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const shortSha = context.sha.slice(0, 7);
            const body = [
              "<!-- ai-vault-ci-failure -->",
              "The main branch CI failed.",
              "",
              `- Workflow: ${context.workflow}`,
              `- Run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              `- Actor: ${context.actor}`,
              "",
              "Please check the failing job logs and fix the build before creating a release."
            ].join("\n");

            const query = `repo:${owner}/${repo} is:issue is:open in:title "${title}"`;
            const search = await github.rest.search.issuesAndPullRequests({ q: query, per_page: 1 });

            if (search.data.items.length > 0) {
              const issueNumber = search.data.items[0].number;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `${body}\n\nNew failing commit: \`${shortSha}\``
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body
              });
            }
