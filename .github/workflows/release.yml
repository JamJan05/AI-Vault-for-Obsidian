name: Build and Prerelease

on:
  push:
    branches:
      - safety-O
    tags:
      - "*-beta.*"
      - "*-alpha.*"
      - "*-rc.*"
  workflow_dispatch:

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Check and build plugin
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.release_version.outputs.version }}
      publish_release: ${{ steps.release_eligibility.outputs.publish }}
      release_sha: ${{ steps.release_eligibility.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve build version
        id: release_version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          node -p '"version=" + require("./package.json").version' >> "${GITHUB_OUTPUT}"

      - name: Sync build metadata
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const version = process.env.RELEASE_VERSION;
          if (!version) throw new Error("RELEASE_VERSION is empty");

          const readJson = (path) => JSON.parse(fs.readFileSync(path, "utf8"));
          const writeJson = (path, data) => {
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + "\n");
          };

          const manifest = readJson("manifest.json");
          manifest.version = version;
          writeJson("manifest.json", manifest);

          const pkg = readJson("package.json");
          pkg.version = version;
          writeJson("package.json", pkg);

          if (fs.existsSync("package-lock.json")) {
            const lock = readJson("package-lock.json");
            lock.version = version;
            if (lock.packages?.[""]) lock.packages[""].version = version;
            writeJson("package-lock.json", lock);
          }

          if (fs.existsSync("versions.json")) {
            const versions = readJson("versions.json");
            versions[version] = manifest.minAppVersion;
            writeJson("versions.json", versions);
          }
          NODE

      - name: Determine prerelease eligibility
        id: release_eligibility
        shell: bash
        run: |
          publish=false
          release_sha="${GITHUB_SHA}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" == *-* ]]; then
            release_sha="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
            publish=true
          fi

          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          echo "sha=${release_sha}" >> "${GITHUB_OUTPUT}"

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm run test --if-present

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-vault-plugin
          if-no-files-found: error
          path: |
            main.js
            styles.css
            manifest.json

  prerelease:
    name: Publish GitHub prerelease
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.publish_release == 'true'
    permissions:
      contents: write

    steps:
      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-vault-plugin

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.build.outputs.release_version }}
          target_commitish: ${{ needs.build.outputs.release_sha }}
          generate_release_notes: true
          prerelease: true
          make_latest: false
          files: |
            main.js
            styles.css
            manifest.json