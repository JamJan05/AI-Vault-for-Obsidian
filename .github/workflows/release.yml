name: Build and Prerelease

on:
  push:
    branches:
      - safety-O
    tags:
      - "*-beta"
      - "*-beta.*"
      - "*-alpha"
      - "*-alpha.*"
      - "*-rc"
      - "*-rc.*"

  release:
    types:
      - published

  workflow_dispatch:

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Check and build plugin
    runs-on: ubuntu-latest

    outputs:
      release_version: ${{ steps.release_version.outputs.version }}
      publish_release: ${{ steps.release_eligibility.outputs.publish }}
      release_tag: ${{ steps.release_version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.target_commitish || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve build version
        id: release_version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            echo "version=${{ github.event.release.tag_name }}" >> "${GITHUB_OUTPUT}"
            echo "tag=${{ github.event.release.tag_name }}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
            echo "tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          VERSION="$(node -p 'require("./package.json").version')"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=" >> "${GITHUB_OUTPUT}"

      - name: Sync build metadata
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const version = process.env.RELEASE_VERSION;
          if (!version) throw new Error("RELEASE_VERSION is empty");

          const readJson = (path) => JSON.parse(fs.readFileSync(path, "utf8"));
          const writeJson = (path, data) => {
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + "\n");
          };

          const manifest = readJson("manifest.json");
          manifest.version = version;
          writeJson("manifest.json", manifest);

          const pkg = readJson("package.json");
          pkg.version = version;
          writeJson("package.json", pkg);

          if (fs.existsSync("package-lock.json")) {
            const lock = readJson("package-lock.json");
            lock.version = version;
            if (lock.packages?.[""]) lock.packages[""].version = version;
            writeJson("package-lock.json", lock);
          }

          if (fs.existsSync("versions.json")) {
            const versions = readJson("versions.json");
            versions[version] = manifest.minAppVersion;
            writeJson("versions.json", versions);
          }
          NODE

      - name: Determine prerelease eligibility
        id: release_eligibility
        shell: bash
        run: |
          publish=false

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            if [[ "${{ github.event.release.prerelease }}" == "true" && "${{ github.event.release.tag_name }}" == *-* ]]; then
              publish=true
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" == *-* ]]; then
            publish=true
          fi

          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm run test --if-present

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-vault-plugin
          if-no-files-found: error
          path: |
            main.js
            styles.css
            manifest.json

  prerelease:
    name: Publish GitHub prerelease assets
    runs-on: ubuntu-latest
    needs: build

    if: needs.build.outputs.publish_release == 'true'

    permissions:
      contents: write

    steps:
      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-vault-plugin

      - name: Upload prerelease assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: ${{ needs.build.outputs.release_version }}
          prerelease: true
          make_latest: false
          files: |
            main.js
            styles.css
            manifest.json